name: Update Top Languages

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen_top_langs.py"
      - ".github/workflows/update-langs.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require GH_PAT (private repos)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Secret GH_PAT ausente. Crie um classic PAT com scope 'repo' e adicione em Settings → Secrets → GH_PAT. Sem isso o card fica só com repos públicos."
            exit 1
          fi

      - name: Generate languages.svg (public + private)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: jhonzito66
          LANGS_EXCLUDE_REPOS: MaxSys
          LANGS_EXCLUDE_LANGS: Pascal
          LANGS_MIN_PRIVATE: "5"
        run: python3 scripts/gen_top_langs.py

      - name: Commit languages.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --staged --quiet || git commit -m "chore: refresh top languages (public + private)"
          git push
