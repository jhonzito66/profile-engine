name: Update Top Languages

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen_top_langs.py"
      - ".github/workflows/update-langs.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate languages.svg (public + private)
        env:
          # PAT com scope `repo` necessário para contar privados.
          # Sem o secret, só entra o que o GITHUB_TOKEN enxerga (este repo).
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_USERNAME: jhonzito66
          LANGS_EXCLUDE_REPOS: MaxSys
          LANGS_EXCLUDE_LANGS: Pascal
        run: python3 scripts/gen_top_langs.py

      - name: Commit languages.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --staged --quiet || git commit -m "chore: refresh top languages (public + private)"
          git push
